[project]
name = "msa-app"
version = "0.13.0"
description = "Measurement System Analysis — Streamlit app (gage-study ingest; Gage R&R math lands later)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "quality-core",
    "streamlit>=1.56.0",
    "pandas>=3.0.2",
    "pydantic>=2.0",
    "scipy>=1.17.1",    # msa_app.gage_rr_engine: F critical value for the ANOVA interaction test (#195)
    "openpyxl>=3.1.5",  # msa_app.exporter writes .xlsx via openpyxl
    "fpdf2>=2.8.7",     # msa_app.exporter renders .pdf via fpdf2
]

[tool.uv.sources]
quality-core = { workspace = true }

# Installed (editable) rather than path-hacked: apps/secom's MSA-applicability test
# imports msa_app.gage_rr_engine read-only (#68), which needed a conftest sys.path
# shim until #231. Still runnable in place via `streamlit run app.py`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["msa_app"]
