[project]
name = "quality-database-app"
version = "0.14.0"
description = "Quality knowledge base — ingestion + cleaning pipeline over the corpus ledger (M4-2)."
authors = [{ name = "Siddardth Pathipaka", email = "siddardth7@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
# Zero new dependencies (#283, SME-locked): stdlib (csv/re/json/logging) plus the
# already-installed pydantic, reached through quality_core.schema.StrictModel.
dependencies = [
    "quality-core",
    "pydantic>=2.0",
]

[tool.uv.sources]
quality-core = { workspace = true }

# Engine-only, like apps/secom (#206): a tested library with no entry script and no
# Streamlit dependency at all — this app is pure text processing.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quality_database_app"]
