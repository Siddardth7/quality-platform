[project]
name = "secom-app"
version = "0.12.0"
description = "SECOM semiconductor manufacturing dataset — honest ingest + signal-selection screen (W09-1)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "quality-core",
    "spc-app",  # secom_app.charts/.capability reuse spc_app.spc_engine read-only (#204)
    "streamlit>=1.56.0",
    "pandas>=3.0.2",
    "pydantic>=2.0",
    "scipy>=1.17.1",
    "numpy>=2.4.4",
]

[tool.uv.sources]
quality-core = { workspace = true }
spc-app = { workspace = true }

# Engine-only (#206): a library with no entry script, deliberately not mounted in
# the Streamlit shell. Still installed (editable) so apps/api can `import secom_app`
# as a library (#204, OQ2) — engine-only is about the UI surface, not packaging.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["secom_app"]
