[project]
name = "quality-controlplan"
version = "0.16.0"
description = "Control Plan — Streamlit app (validated ingest scaffold; FMEA mapping and authoring UI land later)."
authors = [{ name = "Siddardth Pathipaka", email = "siddardth7@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: OS Independent",
    "Intended Audience :: Manufacturing",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "quality-core==0.16.0",  # exact pin: one version across the workspace (#292)
    "streamlit>=1.56.0",
    "pandas>=3.0.2",
    "pydantic>=2.0",
    "openpyxl>=3.1.5",
    "fpdf2>=2.8.7",
]

[project.urls]
Homepage = "https://github.com/Siddardth7/quality-platform"
Repository = "https://github.com/Siddardth7/quality-platform"

[tool.uv.sources]
quality-core = { workspace = true }

# Installed (editable) rather than path-hacked, so `uv build` produces a wheel for the
# engine surface (#261). Still runnable in place via `streamlit run app.py`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["controlplan_app"]
