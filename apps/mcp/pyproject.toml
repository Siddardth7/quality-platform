[project]
name = "mcp-app"
version = "0.13.0"
description = "MCP server exposing the quality-platform engines as tools (FastMCP, stdio)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "quality-core",
    "fastmcp==3.4.6",
    "fmea-app",
    "spc-app",
    "msa-app",
]

[project.scripts]
quality-mcp = "mcp_app.server:main"

# mcp-app is the aggregator: it is the one intentional exception to the
# "apps never import each other" rule (SME sign-off, #262) — wrapping domain-app
# engines as MCP tools is its whole purpose. Peer apps still never import peers;
# tests/test_import_boundary.py documents and enforces the exception's limits.
[tool.uv.sources]
quality-core = { workspace = true }
fmea-app = { workspace = true }
spc-app = { workspace = true }
msa-app = { workspace = true }

# Installed (editable wheel), like msa/secom rather than the `package = false`
# Streamlit apps: a console-script entry point (`uvx --from . quality-mcp`) only
# resolves through an installed distribution.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcp_app"]
