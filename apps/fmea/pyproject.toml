[project]
name = "fmea-app"
version = "0.14.0"
description = "FMEA Risk Analyzer — Streamlit app (RPN / AIAG-VDA Action Priority)."
authors = [{ name = "Siddardth Pathipaka", email = "siddardth7@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "quality-core",
    "streamlit>=1.56.0",
    "pandas>=3.0.2",
    "plotly>=6.6.0",
    "fpdf2>=2.8.7",
    "openpyxl>=3.1.5",
    "numpy>=2.4.4",
    "matplotlib>=3.10.8",
    "pydantic>=2.13.4",
]

[tool.uv.sources]
quality-core = { workspace = true }

# Installed (editable) rather than path-hacked, so `uv build` produces a wheel for the
# engine surface (#261). Still runnable in place via `streamlit run app.py`.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fmea_app"]
